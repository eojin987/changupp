<!DOCTYPE html>
<html lang="ko" data-theme-auto>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEACH:AI 1차 시안 | 이음(E:UM)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f3;--c:#fff;--ink:#18221e;--mu:#56655f;--ln:#d9e0dc;--br:#1b4d3e;--br2:#e0eee8;--on:#fff;--wh:#c4373b;--wh2:#fbe9e9;--ca:#b85a05;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--c:#18211d;--ink:#e8efeb;--mu:#9bb0a6;--ln:#2a3731;--br:#7fd3b0;--br2:#1c3329;--on:#0c1a14;--wh:#ff8a8d;--wh2:#3a1e20;--ca:#ffb25e}}
:root[data-theme="dark"]{--bg:#0f1512;--c:#18211d;--ink:#e8efeb;--mu:#9bb0a6;--ln:#2a3731;--br:#7fd3b0;--br2:#1c3329;--on:#0c1a14;--wh:#ff8a8d;--wh2:#3a1e20;--ca:#ffb25e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:860px;margin:0 auto;padding:0 18px}
.board{background:#173a30;color:#f3f1e7;padding:22px 0 44px;border-bottom:8px solid #8a5a2b}
.logo{font-weight:900;font-size:19px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo span{font-weight:500;font-size:12px;border:1px solid #f2d16b;color:#f2d16b;border-radius:99px;padding:1px 10px}
h1{font-weight:900;font-size:clamp(26px,7vw,46px);line-height:1.28;margin:34px 0 14px;letter-spacing:-.02em}
h1 s{display:block;opacity:.55;font-weight:500;font-size:.62em;text-decoration-color:#f2d16b;text-decoration-thickness:3px}
h1 em{font-style:normal;color:#f2d16b}
.board p{max-width:34em;margin:0 0 20px;color:#d8e3dc}
h2{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:18px;margin:2px 0 6px}
sec{display:block;padding:36px 0 0}
.mu,.sl{color:var(--mu)}.sl{font-size:13px;margin:4px 0}
.btn{background:var(--br);color:var(--on);border:0;border-radius:10px;padding:11px 20px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.board .btn{background:#f2d16b;color:#173a30}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}
.btn:disabled{opacity:.35;cursor:default}
.prob{border-left:4px solid var(--br);padding:2px 0 2px 14px;margin:14px 0}
.prob b{display:block}
.card{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:18px}
.pg{display:flex;gap:6px;margin:12px 0}.pg span{flex:1;height:6px;border-radius:9px;background:var(--ln)}.pg span.on{background:var(--br)}
.chs{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:8px 0}
.chs.one{grid-template-columns:1fr}
.chip{text-align:left;background:var(--bg);border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;color:inherit;font:inherit;font-size:15px;cursor:pointer}
.chip small{display:block;color:var(--mu);font-size:12.5px;line-height:1.5}
.chip.on{border-color:var(--br);background:var(--br2)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.nv{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.ck{display:flex;align-items:center;font-size:14px;color:var(--ink);margin:2px 0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}th,td{border-bottom:1px solid var(--ln);padding:8px;text-align:left;vertical-align:top}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:14px 0}.stats div{flex:1 1 200px}.stats b{display:block;font-size:30px;font-weight:900;color:var(--br);line-height:1.2}
dl{margin:10px 0}dt{font-weight:700;margin-top:10px}dd{margin:0;color:var(--mu)}
ol.tl{margin:8px 0;padding-left:20px}ol.tl li{margin:6px 0}
footer{padding:30px 0 130px;font-size:13px;color:var(--mu)}
.bot{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:20;color:#fff;font-family:inherit}
.bot small{font-size:10.5px;font-weight:700;margin-top:3px}
.bot.car{left:12px;background:#e8801a}.bot.wh{right:12px;background:#c4373b}
.pn{position:fixed;bottom:calc(94px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 24px));max-height:58vh;overflow:auto;background:var(--c);border:2px solid;border-radius:14px;padding:12px 14px;z-index:19;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14.5px;line-height:1.6}
.pn[hidden]{display:none}.pn.car{left:12px;border-color:#e8801a}.pn.wh{right:12px;border-color:var(--wh)}
.ph{display:flex;justify-content:space-between;align-items:center}.ph button{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:4px 8px}
.pn ul{padding-left:18px;margin:6px 0}.pn li{margin:6px 0}
.al{background:var(--wh2);color:var(--wh);border-radius:10px;padding:8px 10px;font-weight:700;margin:8px 0}
.shake{animation:sh .5s}@keyframes sh{20%{transform:translateX(-5px) rotate(-8deg)}40%{transform:translateX(5px) rotate(8deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
:focus-visible{outline:3px solid #e8801a;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.top{background:var(--c);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto;padding:12px 16px}
.mk{width:30px;height:30px;border-radius:8px;background:var(--br);color:var(--on);display:grid;place-items:center;font-weight:900;font-size:15px}
.bar b{font-size:17px;letter-spacing:-.01em}
.tag{font-size:12px;font-weight:700;background:var(--br2);color:var(--br);padding:2px 10px;border-radius:99px}
.sp{flex:1}.bar .mu{font-size:13px}
.shell{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto;padding:16px 16px 130px}
.rail{display:flex;gap:6px;overflow-x:auto}
.st{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;border-radius:10px;border:0;background:none;color:var(--mu);font:inherit;font-size:14px;text-align:left;cursor:pointer;white-space:nowrap}
.st i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;flex:none}
.st.cur{background:var(--c);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--br)}
.st.cur i{background:var(--br);color:var(--on);border-color:var(--br)}
.st.dn i{background:var(--br2);color:var(--br);border-color:var(--br)}
.pg{display:none}
.ws{padding:22px;min-height:360px}.ws h3{font-size:21px;margin:0 0 4px}
.sm{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:16px}
.sm h3{font-size:15px;margin:0 0 10px}
.pb{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--br);transition:width .3s}
.sr{padding:9px 0;border-top:1px solid var(--ln);font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.sr span{display:block;font-size:12px;color:var(--mu)}
.tg{display:inline-block;background:var(--br2);color:var(--br);border-radius:6px;padding:0 8px;margin:2px 4px 2px 0;font-size:12.5px;font-weight:500}
@media(min-width:900px){.shell{grid-template-columns:200px minmax(0,1fr) 290px;align-items:start}.rail{flex-direction:column;overflow:visible;position:sticky;top:16px}.sm{position:sticky;top:16px}}
</style>
</head>
<body>
<header class="top"><div class="bar"><div class="mk">T</div><b>TEACH:AI</b><span class="tag">1차 시안</span><span class="sp"></span><span class="mu">교사용 AI 수업 설계</span></div></header>
<div class="shell">
<nav class="rail" id="rail" aria-label="설계 단계"></nav>
<section class="card ws" id="design"><div class="pg" id="pg"></div><div id="stage"></div><div class="nv" id="nv"></div></section>
<aside class="sm" id="sm"></aside>
</div>
<button id="bc" class="bot car" onclick="bot('c')" aria-label="당근봇 열기">🥕<small>당근봇</small></button>
<button id="bw" class="bot wh" onclick="bot('w')" aria-label="채찍봇 열기"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 27l5-9" stroke-width="5"/><path d="M10 18c6-2 4-9 11-9 5 0 6 5 3 7"/><path d="M24 16l3 4"/></svg><small>채찍봇</small></button>
<div id="pc" class="pn car" hidden></div>
<div id="pw" class="pn wh" hidden></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const go=id=>$(id).scrollIntoView({behavior:"smooth"});
const S={dir:[],sub:"과학",grade:"중2",time:50,lv:"보통",goal:"",method:"",picks:[],intent:"",step:1,done:false};
const D=[["강의형","핵심 개념을 체계적으로 전달"],["참여형","질문과 활동으로 수업에 참여"],["탐구형","스스로 발견하고 검증"],["협력형","모둠 안에서 함께 해결"],["자기주도형","학습자가 속도와 경로를 결정"],["프로젝트형","결과물을 만들며 배움"]];
const W={강의형:{플립러닝:2},참여형:{토의토론:2,협동학습:1},탐구형:{탐구학습:2,PBL:1},협력형:{협동학습:2,토의토론:1},자기주도형:{플립러닝:2,탐구학습:1},프로젝트형:{PBL:2,협동학습:1}};
const M={
플립러닝:{r:"개념 학습은 사전 영상으로 넘기고 수업 시간은 적용과 질문에 쓸 수 있어요",a:{도입:["퀴즈 (사전학습 확인)","챗봇 (질문 모으기)"],전개:["영상 (핵심 개념 요약)","이미지 (적용 과제 상황)"],정리:["인포그래픽 (핵심 정리)"]},t:["사전학습 퀴즈로 이해 정도 확인","개념 질문 해결 후 적용 문제 풀이","오늘 배운 내용 한 장으로 정리"]},
PBL:{r:"실제 문제를 중심으로 결과물을 만들며 배우는 수업에 맞아요",a:{도입:["이미지 (문제 상황 제시)","영상 (동기 유발)"],전개:["데이터 시각화 (자료 분석)","챗봇 (아이디어 조언자)"],정리:["영상 (결과 발표)"]},t:["문제 상황 제시와 과제 이해","모둠별 해결안 설계와 결과물 제작","발표와 상호 피드백"]},
협동학습:{r:"역할을 나눠 서로 가르치고 배우는 활동에 적합해요",a:{도입:["이미지 (모둠 과제 제시)"],전개:["게이미피케이션 (모둠 미션)","데이터 시각화 (결과 공유)"],정리:["퀴즈 (모둠 점검)"]},t:["모둠 구성과 역할 안내","역할별 학습 후 모둠 과제 해결","모둠 성찰과 개인 확인 퀴즈"]},
탐구학습:{r:"원리를 스스로 발견하고 검증하는 활동에 적합해요",a:{도입:["영상 (현상 관찰)","이미지 (탐구 질문 제시)"],전개:["데이터 시각화 (결과 분석)","챗봇 (가설 점검)"],정리:["인포그래픽 (탐구 결과 정리)"]},t:["현상 관찰과 탐구 질문 만들기","가설 설정, 탐구 활동, 결과 분석","결론 도출과 일반화"]},
토의토론:{r:"서로 다른 관점을 말하고 근거를 따지는 수업에 적합해요",a:{도입:["이미지 (논제 상황 제시)"],전개:["챗봇 (반론 연습 상대)","데이터 시각화 (근거 자료)"],정리:["인포그래픽 (입장 정리)"]},t:["논제 제시와 입장 정하기","근거 찾기와 토의 진행","결론 정리와 입장 변화 성찰"]}};
const FREE=/알아서|아무거나|대충|다\s?(만들|해)\s?줘|그냥\s?추천|모르겠|몰라/;
const FM=["잠깐요. ‘알아서 해줘’는 기획이 아니라 위임이에요. 학생이 무엇을 할 수 있게 되길 바라는지 한 문장만 직접 써보세요.","AI는 초안을 쓸 뿐 수업의 주인은 선생님이에요. 아이디어 없이 시작하면 어느 수업에나 맞는 평범한 지도안만 나와요.","날로 먹기 감지. 목표도 의도도 비어 있는데 결과물부터 기대하고 있어요."];
const ACT=/(할 수 있|설명|비교|분석|해결|만들|발표|평가|적용)/;
let T,LW=0,FI=0;

const sel=(k,a)=>`<select onchange="S.${k}=this.value">${a.map(o=>`<option ${S[k]==o?"selected":""}>${o}</option>`).join("")}</select>`;
function rec(){const sc={};S.dir.forEach(d=>{for(const m in W[d])sc[m]=(sc[m]||0)+W[d][m]});return[...Object.keys(sc).sort((a,b)=>sc[b]-sc[a]),...Object.keys(M)].filter((m,i,a)=>a.indexOf(m)==i).slice(0,2)}

function render(){
 const s=S.step,N=["수업 방향 진단","수업 환경과 학습목표","교수방법 추천","AI 산출물 매칭","수업 설계안 생성"];
 $("pg").innerHTML=[1,2,3,4,5].map(i=>`<span class="${i<=s?"on":""}"></span>`).join("");
 let h=`<p class="sl">${s}단계 중 5단계 기준</p><h3>${N[s-1]}</h3>`.replace(`${s}단계 중 5단계 기준`,`STEP ${s} / 5`);
 if(s==1)h+=`<p class="mu">원하는 수업 방향을 골라보세요. 1~2개를 권해요.</p><div class="chs">${D.map(([n,d])=>`<button class="chip ${S.dir.includes(n)?"on":""}" onclick="tg('${n}')"><b>${n}</b><small>${d}</small></button>`).join("")}</div>`;
 if(s==2)h+=`<div class="row"><div><label>교과</label><input value="${esc(S.sub)}" oninput="S.sub=this.value"></div><div><label>학년</label>${sel("grade",["초등","중1","중2","중3","고1","고2","고3"])}</div><div><label>수업 시간(분)</label>${sel("time",[40,45,50,90])}</div><div><label>학습자 수준</label>${sel("lv",["기초","보통","심화"])}</div></div><label>학습목표 (내 말로 직접 써보세요)</label><textarea rows="3" placeholder="예) 전자기 유도 현상을 실험으로 관찰하고 원리를 자신의 말로 설명할 수 있다" oninput="S.goal=this.value;chk(this.value)">${esc(S.goal)}</textarea>`;
 if(s==3){h+=`<p class="mu">${esc(S.sub)} ${S.grade} ${S.time}분, ${S.dir.join("+")} 방향에 맞춰 추천했어요.</p><div class="chs one">${rec().map((m,i)=>`<button class="chip ${S.method==m?"on":""}" onclick="pm('${m}')"><b>추천 ${i+1}. ${m}</b><small>${M[m].r}${m=="PBL"&&S.time<=50?" (한 차시로는 빠듯해요. 차시 확장을 고려하세요.)":""}</small></button>`).join("")}</div><p class="sl">추천은 참고일 뿐, 선택은 선생님 몫이에요.</p>`}
 if(s==4)h+=`<p class="mu">${S.method} 수업에 필요한 AI 산출물을 단계별로 골라보세요. 많을수록 좋은 게 아니에요.</p>`+["도입","전개","정리"].map(st=>`<p class="sl"><b>${st}</b></p><div class="chs">${M[S.method].a[st].map(x=>`<button class="chip ${S.picks.includes(st+"|"+x)?"on":""}" onclick="pk('${st}|${x}')">${x}</button>`).join("")}</div>`).join("");
 if(s==5){h+=`<label>이 수업에서 내가 꼭 이루고 싶은 것 (한 줄, 직접 써주세요)</label><textarea rows="2" placeholder="예) 공식 암기보다 왜 전류가 생기는지 스스로 말해 보게 하고 싶다" oninput="S.intent=this.value;chk(this.value)">${esc(S.intent)}</textarea><button class="btn" style="margin-top:10px" onclick="gen()">지도안 만들기</button>`;if(S.done)h+=plan()}
 $("stage").innerHTML=h;
 $("nv").innerHTML=`<button class="btn ghost" onclick="pv()" ${s==1?"disabled":""}>이전</button>`+(s<5?`<button class="btn" onclick="nx()">다음</button>`:`<button class="btn ghost" onclick="rs()">처음부터</button>`);
}
function plan(){const t=+S.time,a=Math.round(t*.1),c=Math.round(t*.2),tm=[a,t-a-c,c],m=M[S.method];
 const rows=["도입","전개","정리"].map((st,i)=>`<tr><td><b>${st}</b><br>${tm[i]}분</td><td>${m.t[i]}</td><td>${S.picks.filter(p=>p.startsWith(st+"|")).map(p=>p.split("|")[1]).join("<br>")||"-"}</td></tr>`).join("");
 return `<div style="margin-top:20px;border-top:1px solid var(--ln);padding-top:14px"><h3>교수·학습 지도안 초안</h3><p><b>${esc(S.sub)} ${S.grade}, ${t}분, ${S.method}</b></p><p>학습목표: ${esc(S.goal)}<br>교사 의도: ${esc(S.intent)}</p><div class="tw"><table><tr><th>단계</th><th>교수·학습 활동</th><th>AI 자료</th></tr>${rows}</table></div><p class="sl" style="margin-top:12px"><b>교사 검토</b></p><label class="ck"><input type="checkbox">출처와 사실 여부를 확인했다</label><label class="ck"><input type="checkbox">교육적으로 타당한지 점검했다</label><label class="ck"><input type="checkbox">학생 개인정보가 들어 있지 않다</label><p class="sl">실제 서비스에서는 AI API가 활동을 더 구체적으로 생성합니다.</p></div>`}

function tg(n){const i=S.dir.indexOf(n);if(i>=0)S.dir.splice(i,1);else if(S.dir.length<3)S.dir.push(n);else return bot("w","3개를 넘기면 초점이 흐려져요. 하나를 빼고 골라보세요.");render()}
const pm=m=>{if(S.method!=m){S.method=m;S.picks=[]}render()};
const pk=x=>{const i=S.picks.indexOf(x);i>=0?S.picks.splice(i,1):S.picks.push(x);render()};
function nx(){const s=S.step;let m="";
 if(s==1&&!S.dir.length)m="수업 방향을 하나도 고르지 않았어요. 방향 없이 도구부터 고르면 결국 ‘무엇을 만들까’로 돌아가요.";
 else if(s==2){const g=S.goal.trim();if(FREE.test(g))m=FM[0];else if(g.length<15)m="학습목표가 15자도 안 돼요. 직접 쓰지 않으면 AI는 어느 수업에나 맞는 평범한 추천만 내놔요."}
 else if(s==3&&!S.method)m="교수방법을 직접 골라야 해요. 추천은 참고, 선택은 교사의 몫이에요.";
 else if(s==4&&!S.picks.length)m="AI 자료를 하나도 고르지 않았어요. 이 수업에 꼭 필요한 것만 직접 골라보세요.";
 if(m)return bot("w",m);
 S.step++;if(S.step==3&&!rec().includes(S.method)){S.method="";S.picks=[]}render();go("design")}
const pv=()=>{S.step--;render()};
const rs=()=>{Object.assign(S,{dir:[],goal:"",method:"",picks:[],intent:"",step:1,done:false});render();go("design")};
function gen(){const i=S.intent.trim();if(FREE.test(i))return bot("w",FM[1]);if(i.length<15)return bot("w","수업 의도 한 줄이 비었어요. 이 한 줄이 없으면 지도안은 AI의 작품이지 선생님의 수업이 아니에요.");S.done=true;render()}
function chk(t){clearTimeout(T);T=setTimeout(()=>{if(FREE.test(t)&&Date.now()-LW>5000){LW=Date.now();bot("w",FM[FI++%3])}},600)}

function wl(){const L=[],g=S.goal.trim();
 if(!S.dir.length)L.push("수업 방향이 아직 비어 있어요. 방향 없이 도구부터 고르면 ‘무엇을 만들까’로 돌아가요.");
 if(S.dir.length>=3)L.push("방향을 3개나 골랐어요. 한 시간에 다 담으면 초점이 흐려져요. 핵심 1~2개로 좁혀보세요.");
 if(!g)L.push("학습목표가 비었어요. 목표가 없으면 교수방법도 자료도 근거가 없어요.");
 else{if(g.length<15)L.push("학습목표가 너무 짧아요. 대상, 행동, 조건이 보이게 구체화하세요.");if(!ACT.test(g))L.push("학습목표가 ‘~할 수 있다’처럼 관찰 가능한 행동으로 끝나지 않아요. 평가하기 어려워요.")}
 if(S.method=="PBL"&&S.time<=50)L.push("PBL을 한 차시(50분 이하)에 넣기엔 빠듯해요. 차시를 늘리거나 미니 프로젝트로 줄이세요.");
 if(S.picks.length>4)L.push(`AI 자료가 ${S.picks.length}개나 돼요. 자료가 수업을 삼킬 수 있어요. 꼭 필요한 것만 남기세요.`);
 if(S.step==5&&S.intent.trim().length<15)L.push("‘내 수업 의도 한 줄’이 아직이에요. 이게 있어야 교사의 수업이 돼요.");
 const o=L.slice(0,4);o.push("AI 결과는 초안이에요. 출처와 사실 확인, 학생 개인정보 제외는 교사의 책임입니다.");return o}
function cl(){const L=[],g=S.goal.trim();
 if(S.dir.length&&S.dir.length<3)L.push(`수업 방향을 ${S.dir.join(", ")}(으)로 좁혔어요. 설계의 축이 선명해요.`);
 if(g.length>=15&&ACT.test(g))L.push("학습목표가 관찰 가능한 행동으로 쓰였어요. 평가와 바로 연결돼요.");
 if(S.method)L.push(`‘${S.method}’을(를) 직접 골랐어요. ${M[S.method].r}.`);
 if(S.picks.length&&S.picks.length<=4)L.push(`AI 자료를 ${S.picks.length}개로 절제해 단계에 맞게 골랐어요.`);
 if(S.intent.trim().length>=15)L.push("수업 의도를 직접 적었어요. 주도권이 교사에게 있다는 증거예요.");
 if(!L.length)L.push("방향을 고르는 순간부터 AI가 아닌 선생님이 주인공이에요. 일단 시작해볼까요?");
 const o=L.slice(0,4);o.push("끝까지 직접 판단하며 설계하는 태도가 가장 큰 강점이에요.");return o}

function bot(k,al){const p=$("p"+k);$("p"+(k=="c"?"w":"c")).hidden=true;
 if(!p.hidden&&!al){p.hidden=true;return}
 p.innerHTML=`<div class="ph"><b>${k=="c"?"🥕 당근봇: 잘한 점":"채찍봇: 비판과 보완"}</b><button onclick="bot('${k}')" aria-label="닫기">✕</button></div>${al?`<p class="al">경고! ${al}</p>`:""}<ul>${(k=="c"?cl():wl()).map(i=>`<li>${i}</li>`).join("")}</ul>`;
 p.hidden=false;
 if(al){const b=$("b"+k);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}}
render();

const NM=["수업 방향","환경과 목표","교수방법","AI 자료","지도안"];
const gt=n=>{if(n<=S.step){S.step=n;render()}};
function side(){
 $("rail").innerHTML=NM.map((n,i)=>`<button class="st ${S.step==i+1?"cur":i+1<S.step?"dn":""}" onclick="gt(${i+1})"><i>${i+1<S.step?"✓":i+1}</i>${n}</button>`).join("");
 const f=[S.dir.length>0,S.goal.trim().length>=15,!!S.method,S.picks.length>0,S.intent.trim().length>=15,S.done],p=Math.round(f.filter(Boolean).length/6*100);
 const r=(k,v)=>`<div class="sr"><span>${k}</span>${v||`<span style="font-size:13.5px">아직 비어 있어요</span>`}</div>`;
 $("sm").innerHTML=`<h3>내 수업 한눈에 보기</h3><div class="pb"><i style="width:${p}%"></i></div><p class="sl">작성 ${p}%</p>`
 +r("수업 방향",S.dir.map(d=>`<span class="tg">${d}</span>`).join(""))
 +r("수업 환경",`${esc(S.sub)} ${S.grade}, ${S.time}분, ${S.lv} 수준`)
 +r("학습목표",esc(S.goal.trim()))
 +r("교수방법",S.method&&`<span class="tg">${S.method}</span>`)
 +r("AI 자료",S.picks.map(x=>`<span class="tg">${x.split("|")[1].split(" (")[0]}</span>`).join(""))
 +r("내 수업 의도",esc(S.intent.trim()));
}
const _r=render;render=function(){_r();side()};render();
</script>
</body>
</html>
